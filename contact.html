<html>
<style>

    body {
        background-color: skyblue;
        margin: 0;
    }

    h1 {
        font-size: 70px;
        color: #ffffff;
        text-align: center;
        margin: 10px;
        font-style: monospace;
    }

    p {
        text-align: center;
        font-size: 35px;
        color: gray;
    }

    header {
        background-color: rgb(44, 3, 3);
        padding: 20px;
    }

    nav ul {
        list-style-type: none;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
        padding: 6px;
        margin: 10px;
    }

    nav a {
        color: gold;
        font-size: 25px;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 10px;
        transition: 0.3s ease;
    }

    nav a:hover {
        color: pink;
        background-color: rgb(90, 10, 10);
        box-shadow: 0 0 15px gold;
        cursor: progress;
    }

    main {
        padding: 30px;
    }

    .contact-title {
        text-align: center;
        font-size: 50px;
        color: rgb(70, 4, 4);
        margin-top: 30px;
    }

    .contact-text {
        text-align: center;
        font-size: 25px;
        color: rgb(44, 3, 3);
    }

    form {
        max-width: 700px;
        margin: 40px auto;
    }

    fieldset {
        background-color: rgb(44, 3, 3);
        border: 5px solid gold;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 10px 15px 1px rgba(147, 50, 50, 0.2);
    }

    legend {
        background-color: gold;
        color: rgb(44, 3, 3);
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 25px;
        font-weight: bold;
    }

    label {
        color: white;
        font-size: 22px;
        font-weight: bold;
    }

    input,
    select,
    textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-top: 8px;
        border: 3px solid gold;
        border-radius: 10px;
        background-color: skyblue;
        color: rgb(44, 3, 3);
        font-size: 18px;
        font-family: Arial, sans-serif;
    }

    textarea {
        resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: 3px solid pink;
        box-shadow: 0 0 15px gold;
    }

    button {
        display: block;
        margin: 25px auto 5px;
        background-color: gold;
        color: rgb(44, 3, 3);
        padding: 15px 25px;
        border: none;
        border-radius: 20px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.5s ease, box-shadow 0.5s ease;
    }
    select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin-top: 8px;
    border: 3px solid gold;
    border-radius: 10px;
    background-color: skyblue;
    color: rgb(44, 3, 3);
    font-size: 18px;
}

    select option {
    background-color: black;
    color: white;
}

    button:hover {
        color: pink;
        background-color: rgb(90, 10, 10);
        box-shadow: 0 0 15px gold;
        transform: translateY(-5px) scale(1.03);
    }

    footer {
        background-color: rgb(44, 3, 3);
        color: white;
        text-align: center;
        padding: 40px;
        line-height: 1.6;
    }

    .aray {
        margin: 0;
        font-size: 20px;
        color: white;
    }

</style>

<body>

<header>

    <h1>Jeez Cartz</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>

<main>

    <h2 class="contact-title">Contact Us</h2>

    <p class="contact-text">
        Have a question? Send us a message!
    </p>

    <form>

        <fieldset>

            <legend>Your details</legend>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="subject">Subject</label>
            <select id="subject" name="subject">

                <option value="product-question">Product Question</option>
                <option value="order-status">Order Status</option>
                <option value="wholesale">Wholesale Enquiry</option>
                <option value="technical-problem">Technical Problem</option>
                <option value="other">Something Else</option>

            </select>

            <br><br>

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="6"
                required></textarea>

            <button type="submit">Send message</button>

        </fieldset>

    </form>

</main>

<footer>

    <p class="aray">
        © 2026 Jeez Cartz. All rights reserved.
    </p> 

</footer>

</body>
</html>
